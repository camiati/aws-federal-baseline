# Terraform checks for aws-federal-baseline
#
# Runs on every pull request and every push to main:
#   1. Format check: code follows Terraform's standard style
#   2. Validate:     code is syntactically valid and internally consistent
#   3. Checkov:      scans the Terraform for security misconfigurations
#
# None of these steps touch AWS. No credentials are needed or stored.

name: Terraform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no AWS access)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Checkov security scan
        run: pipx run --spec checkov==3.3.16 checkov --directory . --framework terraform --compact
